<head>

<title>KÉM — szavas partijáték</title>
<style>
/* saját szerverről, nem a Google-től (GDPR + offline) — licenc: fonts/OFL-*.txt */
@font-face{font-family:"Archivo Black";font-weight:400;font-display:swap;src:url(fonts/archivo-black-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Archivo Black";font-weight:400;font-display:swap;src:url(fonts/archivo-black-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Inter";font-weight:400 700;font-display:swap;src:url(fonts/inter-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Inter";font-weight:400 700;font-display:swap;src:url(fonts/inter-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"JetBrains Mono";font-weight:500 700;font-display:swap;src:url(fonts/jetbrains-mono-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"JetBrains Mono";font-weight:500 700;font-display:swap;src:url(fonts/jetbrains-mono-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --ink:#101728; --ink2:#1A2440; --ink3:#26325A;
  --paper:#F2ECE1; --pink:#FF4E6A; --blue:#5B8CFF; --mustard:#FFC44D;
  --display:"Archivo Black","Haettenschweiler","Impact",system-ui,sans-serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);
  font-size:16px;line-height:1.45;overscroll-behavior:none;
  background-image:
    radial-gradient(circle at 15% -10%, rgba(91,140,255,.16), transparent 55%),
    radial-gradient(circle at 92% 8%, rgba(255,78,106,.13), transparent 50%);
  background-attachment:fixed;
}
.app{max-width:480px;margin:0 auto;min-height:100%;
  padding:max(16px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;animation:in .28s ease}
.screen.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#8695BE}
h1.logo{font-family:var(--display);font-size:clamp(34px,11.5vw,50px);line-height:.88;
  letter-spacing:-.03em;margin:2px 0 0;text-transform:uppercase}
h1.logo span{color:var(--pink)}
h2{font-family:var(--display);font-size:26px;line-height:1.05;letter-spacing:-.02em;margin:0 0 4px;text-transform:uppercase}
.sub{color:#93A0C4;font-size:14px;margin:0}

.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lang{display:flex;gap:4px;flex:0 0 auto}
.lang button{border:1px solid #38457A;background:#212C4E;color:#8695BE;border-radius:9px;
  padding:6px 11px;font-family:var(--mono);font-size:12px;cursor:pointer;letter-spacing:.08em}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:700}

.block{background:var(--ink2);border:1px solid #2A3560;border-radius:16px;padding:14px;margin-top:12px}
.block .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8695BE;display:block;margin-bottom:10px}

.stepper{display:flex;align-items:center;gap:14px}
.stepper .val{font-family:var(--display);font-size:34px;min-width:56px;text-align:center;letter-spacing:-.02em}
.rnd{width:46px;height:46px;flex:0 0 46px;border-radius:50%;border:1px solid #38457A;background:#212C4E;
  color:var(--paper);font-size:24px;line-height:1;cursor:pointer;font-family:var(--body)}
.rnd:active{background:var(--ink3)}
.rnd:disabled{opacity:.3}
.stepper .hint{font-size:13px;color:#93A0C4}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #38457A;background:#212C4E;color:#C7CFE6;border-radius:999px;
  padding:8px 13px;font-size:14px;cursor:pointer;font-family:var(--body)}
.chip[aria-pressed="true"]{background:var(--mustard);border-color:var(--mustard);color:#1A1405;font-weight:700}
.chip.add{border-style:dashed;color:#8695BE}
.catbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.mini{background:none;border:0;color:#8695BE;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;cursor:pointer;padding:2px 0}

.rowlink{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #26325A}
.rowlink:first-of-type{border-top:0}
.rowlink .t{font-size:15px}
.rowlink .d{font-size:12.5px;color:#8695BE;margin-top:1px}
.sw{width:52px;height:31px;flex:0 0 52px;border-radius:999px;border:1px solid #38457A;background:#212C4E;position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#7C89B2;transition:transform .16s ease,background .16s}
.sw[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}
.sw[aria-pressed="true"]::after{transform:translateX(21px);background:#fff}

.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 2px;border-radius:10px;border:1px solid #38457A;background:#212C4E;
  color:#C7CFE6;font-family:var(--mono);font-size:12.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:700}
.segnote{font-size:12.5px;color:#8695BE;margin-top:9px;min-height:34px}
#segHint{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
#segHint button{grid-column:span 2}
#segHint button:nth-child(4),#segHint button:nth-child(5){grid-column:span 3}

input[type=text]{width:100%;background:#212C4E;border:1px solid #38457A;border-radius:10px;
  padding:11px 12px;color:var(--paper);font-family:var(--body);font-size:15px}
input[type=text]::placeholder{color:#66739C}
textarea{width:100%;min-height:110px;background:#212C4E;border:1px solid #38457A;border-radius:10px;
  padding:11px 12px;color:var(--paper);font-family:var(--body);font-size:15px;resize:vertical}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.btn{display:block;width:100%;padding:17px;border-radius:14px;border:0;cursor:pointer;
  font-family:var(--display);font-size:19px;letter-spacing:.01em;text-transform:uppercase}
.btn.primary{background:var(--pink);color:#2A0710}
.btn.paper{background:var(--paper);color:var(--ink)}
.btn.ghost{background:transparent;color:#93A0C4;border:1px solid #38457A;font-family:var(--body);font-size:15px;text-transform:none;padding:13px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4}
.foot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:9px}
.err{color:var(--pink);font-size:13.5px;margin-top:10px;min-height:19px}

.dealwrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.passto{text-align:center}
.passto .who{font-family:var(--display);font-size:clamp(28px,8.5vw,40px);line-height:1;letter-spacing:-.02em;margin-top:6px}

.card{position:relative;width:100%;aspect-ratio:3/4;max-height:56vh;border-radius:22px;
  background:var(--paper);color:var(--ink);border:0;cursor:pointer;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:none;
  box-shadow:0 18px 0 -6px #0B1120, 0 22px 40px rgba(0,0,0,.45);font-family:var(--body)}
.card .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:9px;padding:24px;transition:opacity .13s ease}
.card .front{opacity:0}
.card.open .back{opacity:0}
.card.open .front{opacity:1}
.card .dots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card .dots i{width:13px;height:13px;border-radius:50%;background:rgba(16,23,40,.2);display:block}
.card .thumb{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(16,23,40,.5);margin-top:16px;text-align:center}
.card .role{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#4A5578}
.card .word{font-family:var(--display);font-size:clamp(26px,8.5vw,38px);line-height:1.02;letter-spacing:-.02em;
  text-transform:uppercase;text-align:center;color:var(--ink)}
.card .cat{font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#4A5578;text-align:center}
.card .tip{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.03em;text-align:center;
  padding:10px 16px;margin-top:2px;border-radius:11px;background:rgba(16,23,40,.09);
  color:var(--ink);white-space:pre-line;line-height:1.35}
.card .tip:empty{display:none}
/* csak felfedés közben látszik, hogy kém — előtte-utána semmi nem árulja el */
.card.open.spy .word,.card.open.spy .role{color:#A80B2A}
.card.open.spy::before{content:"";position:absolute;inset:10px;border:3px solid #A80B2A;
  border-radius:14px;pointer-events:none}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(16,23,40,.045) 0 2px,transparent 2px 5px)}
.hint{text-align:center;font-size:13.5px;color:#93A0C4;min-height:20px}

.bigtimer{font-family:var(--display);font-size:clamp(56px,20vw,86px);line-height:1;letter-spacing:-.03em;
  text-align:center;font-variant-numeric:tabular-nums}
.bigtimer.low{color:var(--pink)}
.starter{background:var(--ink2);border:1px solid #2A3560;border-radius:16px;padding:18px;text-align:center;margin-top:12px}
.starter .who{font-family:var(--display);font-size:30px;letter-spacing:-.02em;margin-top:4px}
.score{display:flex;gap:10px;margin-top:12px}
.score>div{flex:1;background:var(--ink2);border:1px solid #2A3560;border-radius:14px;padding:11px;text-align:center}
.score .n{font-family:var(--display);font-size:28px;line-height:1}
.score .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#8695BE}

.plist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.plist button{padding:15px 10px;border-radius:13px;border:1px solid #38457A;background:#212C4E;color:var(--paper);
  font-family:var(--body);font-size:15.5px;cursor:pointer;text-align:left}
.plist button:active{background:var(--ink3)}
.verdict{border-radius:18px;padding:20px;text-align:center;margin-top:14px;color:var(--ink)}
.verdict.good{background:var(--mustard)}
.verdict.bad{background:var(--pink)}
.verdict .h{font-family:var(--display);font-size:27px;line-height:1.05;text-transform:uppercase;letter-spacing:-.02em}
.verdict .b{font-size:14.5px;margin-top:6px;opacity:.8}
.reveal{background:var(--ink2);border:1px solid #2A3560;border-radius:16px;padding:16px;margin-top:12px}
.reveal .w{font-family:var(--display);font-size:32px;letter-spacing:-.02em;text-transform:uppercase;margin-top:2px}
.reveal .imps{margin-top:12px;font-size:15px}
.reveal .imps b{color:var(--pink)}
.tiny{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#5D6A94;text-align:center;margin-top:16px}
.tiny a,.fbw{color:#8695BE;text-decoration:underline;text-underline-offset:3px}
.fbw{display:block;margin-top:12px;font-size:13px}
.tr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
.mini.help{color:#C7CFE6;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

.steps{list-style:none;margin:0;padding:0;counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;column-gap:12px;padding:13px 0;border-top:1px solid #26325A}
.steps li:first-child{border-top:0;padding-top:0}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:counter(st);grid-row:span 2;font-family:var(--display);font-size:26px;line-height:1;color:var(--pink)}
.steps .k{font-family:var(--display);font-size:16px;line-height:1.2;text-transform:uppercase;letter-spacing:.01em}
.steps .v{font-size:14.5px;color:#C7CFE6;margin-top:3px}
.tips{list-style:none;margin:0;padding:0}
.tips li{font-size:14.5px;color:#C7CFE6;padding:10px 0;border-top:1px solid #26325A}
.tips li:first-child{border-top:0;padding-top:0}
.tips li:last-child{padding-bottom:0}
.tips b{color:var(--paper)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

<!-- ============ SETUP ============ -->
<section id="s-setup" class="screen on">
  <div class="topbar">
    <div>
      <div class="eyebrow" data-i="tagline"></div>
      <h1 class="logo" id="logo"></h1>
    </div>
    <div class="tr">
      <div class="lang">
        <button data-l="hu" aria-pressed="true">HU</button>
        <button data-l="en" aria-pressed="false">EN</button>
      </div>
      <button class="mini help" id="btnHelp" data-i="rulesEyebrow"></button>
    </div>
  </div>

  <div class="block">
    <span class="lbl" data-i="players"></span>
    <div class="stepper">
      <button class="rnd" id="pMinus">–</button>
      <div class="val" id="pVal">5</div>
      <button class="rnd" id="pPlus">+</button>
      <div class="hint" data-i="playerRange"></div>
    </div>
    <div class="rowlink" style="margin-top:12px">
      <div><div class="t" data-i="useNames"></div><div class="d" data-i="useNamesD"></div></div>
      <button class="sw" id="swNames" aria-pressed="false"></button>
    </div>
    <div id="nameBox" class="names" style="display:none"></div>
  </div>

  <div class="block">
    <span class="lbl" data-i="spies"></span>
    <div class="stepper">
      <button class="rnd" id="iMinus">–</button>
      <div class="val" id="iVal">1</div>
      <button class="rnd" id="iPlus">+</button>
      <div class="hint" id="iHint"></div>
    </div>
  </div>

  <div class="block">
    <div class="catbar">
      <span class="lbl" style="margin:0" data-i="cats"></span>
      <button class="mini" id="btnAll"></button>
    </div>
    <div class="chips" id="catChips"></div>
    <div class="segnote" id="catNote" style="min-height:0;margin-top:10px"></div>
  </div>

  <div class="block">
    <span class="lbl" data-i="spyGets"></span>
    <div class="seg" id="segHint">
      <button data-h="none"></button>
      <button data-h="cat" aria-pressed="true"></button>
      <button data-h="letters"></button>
      <button data-h="clue"></button>
      <button data-h="decoy"></button>
    </div>
    <div class="segnote" id="hintNote"></div>
    <div class="rowlink"><div><div class="t" data-i="timerT"></div><div class="d" data-i="timerD"></div></div></div>
    <div class="seg" id="segTime">
      <button data-t="0"></button>
      <button data-t="90">1:30</button>
      <button data-t="180" aria-pressed="true">3:00</button>
      <button data-t="300">5:00</button>
    </div>
  </div>

  <div class="err" id="setupErr"></div>
  <div class="foot">
    <button class="btn primary" id="btnStart"></button>
    <button class="btn ghost" id="btnRules" data-i="rulesBtn"></button>
  </div>
  <div class="tiny" data-i="passTiny"></div>
  <div class="tiny" style="margin-top:10px"><a id="fbLink" target="_blank" rel="noopener" data-i="fbLink"></a></div>
</section>

<!-- ============ RULES ============ -->
<section id="s-rules" class="screen">
  <div class="eyebrow" data-i="rulesEyebrow"></div>
  <h2 data-i="rulesH"></h2>
  <p class="sub" data-i="rulesSub"></p>
  <div class="block"><ol class="steps" id="rulesSteps"></ol></div>
  <div class="block">
    <span class="lbl" data-i="tipsLbl"></span>
    <ul class="tips" id="rulesTips"></ul>
  </div>
  <div class="foot"><button class="btn paper" id="btnRulesBack" data-i="back"></button></div>
</section>

<!-- ============ DEAL ============ -->
<section id="s-deal" class="screen">
  <div class="dealwrap">
    <div class="passto">
      <div class="eyebrow" id="dealCount"></div>
      <div class="who" id="dealWho"></div>
    </div>
    <button class="card" id="card">
      <div class="face back">
        <div class="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="thumb" id="cardThumb"></div>
      </div>
      <div class="face front">
        <div class="role" id="cardRole"></div>
        <div class="word" id="cardWord"></div>
        <div class="cat" id="cardCat"></div>
        <div class="tip" id="cardTip"></div>
      </div>
    </button>
    <div class="hint" id="dealHint"></div>
  </div>
  <div class="foot"><button class="btn paper" id="btnNext" disabled></button></div>
</section>

<!-- ============ ROUND ============ -->
<section id="s-round" class="screen">
  <div class="eyebrow" id="roundNo"></div>
  <h2 data-i="roundH"></h2>
  <p class="sub" id="roundTheme"></p>
  <div class="starter">
    <div class="eyebrow" data-i="starts"></div>
    <div class="who" id="starterName"></div>
  </div>
  <div style="margin-top:22px"><div class="bigtimer" id="timer">3:00</div></div>
  <div class="score">
    <div><div class="n" id="scoreTeam">0</div><div class="k" data-i="team"></div></div>
    <div><div class="n" id="scoreImp">0</div><div class="k" data-i="spiesK"></div></div>
  </div>
  <div class="foot">
    <button class="btn paper" id="btnTimer"></button>
    <button class="btn primary" id="btnVote"></button>
  </div>
</section>

/* ================= ÁLLAPOT ================= */
const S = {
  lang:'hu', players:5, imposters:1, useNames:false, names:[],
  cats:["food","animal","movie","huartist"], hintLevel:'cat', timeSet:180,
  round:0, team:0, imp:0,
  word:"", catName:"", packId:"", decoy:"", clue:"", impIdx:[], dealIdx:0, starter:0, pointGiven:null
};
const $ = id => document.getElementById(id);
const t = () => T[S.lang];

function packName(p){ return p.n[S.lang]; }
function packWords(p){
  const s = p.w[S.lang];
  return s ? s.split('|').map(x=>x.trim()).filter(x=>x && !x.endsWith('?')) : null;
}
function availPacks(){ return PACKS.filter(p=>{ const w=packWords(p); return w && w.length>3; }); }

/* --- nyomok --- */
let CLUEMAP = {};
function buildClueMap(){
  CLUEMAP = {};
  const src = CLUES[S.lang] || {};
  for(const pid in src){
    const m = {};
    for(const tag in src[pid]) src[pid][tag].split('|').forEach(w=>{ m[w.trim()] = tag; });
    CLUEMAP[pid] = m;
  }
}
function hasClues(p){
  const m = CLUEMAP[p.id]; if(!m) return false;
  const w = packWords(p);
  return w.filter(x=>m[x]).length >= w.length*0.9;
}
/* a nyom módban csak a nyommal ellátott témák játszhatók */
function usablePacks(){
  const a = availPacks();
  return S.hintLevel==='clue' ? a.filter(hasClues) : a;
}
function nameOf(i){ return (S.useNames && S.names[i] && S.names[i].trim()) ? S.names[i].trim() : (S.lang==='hu' ? (i+1)+'. játékos' : 'Player '+(i+1)); }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $(id).classList.add('on'); window.scrollTo(0,0); }

/* --- mentés --- */
function payload(){
  return JSON.stringify({
    lang:S.lang, players:S.players, imposters:S.imposters, useNames:S.useNames, names:S.names,
    cats:S.cats, hintLevel:S.hintLevel, timeSet:S.timeSet });
}
async function save(){
  try{
    if(window.storage) await window.storage.set('kem:v2', payload());
    else localStorage.setItem('kem:v2', payload());
  }catch(e){}
}
async function load(){
  try{
    if(window.storage){ const r = await window.storage.get('kem:v2'); if(r && r.value) Object.assign(S, JSON.parse(r.value)); }
    else { const v = localStorage.getItem('kem:v2'); if(v) Object.assign(S, JSON.parse(v)); }
  }catch(e){}
}

/* ================= NYELV ================= */
function applyLang(){
  document.documentElement.lang = S.lang;
  const L = t();
  document.querySelectorAll('[data-i]').forEach(el=>{
    const v = L[el.dataset.i]; if(typeof v === 'string') el.textContent = v;
  });
  $('logo').innerHTML = L.logo;
  document.querySelectorAll('.lang [data-l]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.l===S.lang)));
  renderRules();
  $('fbLink').href = issueUrl(L.fbTitle, L.fbBody);
  buildClueMap();
  $('btnStart').textContent = L.deal;
  $('btnNext').textContent = L.next;
  $('btnVote').textContent = L.vote;
  $('btnSkipVote').textContent = L.skipVote;
  $('btnAgain').textContent = L.newRound;
  $('btnHome').textContent = L.settings;
  $('btnFlip').textContent = L.flip;
  $('cardThumb').textContent = L.thumb;
  document.querySelectorAll('#segHint button').forEach(b=> b.textContent = L['h_'+b.dataset.h]);
  document.querySelector('#segTime button[data-t="0"]').textContent = L.tOff;
  // a másik nyelven nem létező témák (pl. Budapest) kiesnek
  const ok = availPacks().map(p=>p.id);
  S.cats = S.cats.filter(c=>ok.includes(c));
  if(!S.cats.length) S.cats = ok.slice(0,4);
  // ha nyom módban egy sincs kiválasztva, adjunk párat
  if(S.hintLevel==='clue' && !usablePacks().some(p=>S.cats.includes(p.id)))
    S.cats = S.cats.concat(usablePacks().slice(0,4).map(p=>p.id));
}

document.querySelectorAll('.lang [data-l]').forEach(b=>
  b.onclick = ()=>{ S.lang=b.dataset.l; applyLang(); renderSetup(); save(); });

  const L = t();
  $('rulesSteps').replaceChildren(...L.rules.map(([k,v])=>{
    const li=document.createElement('li'), a=document.createElement('div'), b=document.createElement('div');
    a.className='k'; a.textContent=k; b.className='v'; b.textContent=v; li.append(a,b); return li;
  }));
  $('rulesTips').replaceChildren(...L.tips.map(([k,v])=>{

const ISSUES = 'https://github.com/balazsap0224/kiakem/issues/new';
function issueUrl(title, body){
  return ISSUES+'?title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body);

/* ================= BEÁLLÍTÁSOK ================= */
function maxImp(){ return Math.max(1, Math.floor((S.players-1)/2)); }

function renderSetup(){
  const L = t();
  $('pVal').textContent = S.players;
  $('pMinus').disabled = S.players<=3;
  $('pPlus').disabled = S.players>=15;
  if(S.imposters>maxImp()) S.imposters = maxImp();
  $('iVal').textContent = S.imposters;
  $('iMinus').disabled = S.imposters<=1;
  $('iPlus').disabled = S.imposters>=maxImp();
  $('iHint').textContent = S.imposters===1 ? L.spiesOne(S.players-1) : L.spiesMany(S.imposters, S.players-S.imposters);
  $('swNames').setAttribute('aria-pressed', S.useNames);
  $('nameBox').style.display = S.useNames ? 'grid' : 'none';
  if(S.useNames) renderNames();
  document.querySelectorAll('#segHint button').forEach(b=> b.setAttribute('aria-pressed', String(b.dataset.h===S.hintLevel)));
  $('hintNote').textContent = L['hn_'+S.hintLevel];
  document.querySelectorAll('#segTime button').forEach(b=> b.setAttribute('aria-pressed', String(+b.dataset.t===S.timeSet)));
  renderChips();
}

function renderNames(){
  const box=$('nameBox'); box.innerHTML='';
  for(let i=0;i<S.players;i++){
    const inp=document.createElement('input');
    inp.type='text'; inp.placeholder=(i+1)+'.'; inp.value=S.names[i]||''; inp.maxLength=14;
    inp.oninput=e=>{ S.names[i]=e.target.value; save(); };
    box.appendChild(inp);
  }
}

function renderChips(){
  const L=t(), box=$('catChips'); box.innerHTML='';
  const packs = usablePacks();
  const on = () => packs.filter(p=>S.cats.includes(p.id)).length;
  $('btnAll').textContent = (on()===packs.length) ? L.selNone : L.selAll;
  packs.forEach(p=>{
    const b=document.createElement('button');
    b.className='chip'; b.textContent=packName(p);
    b.setAttribute('aria-pressed', S.cats.includes(p.id));
    b.onclick=()=>{ const i=S.cats.indexOf(p.id); if(i>=0) S.cats.splice(i,1); else S.cats.push(p.id);
      b.setAttribute('aria-pressed', S.cats.includes(p.id)); $('setupErr').textContent='';
      $('btnAll').textContent = (on()===packs.length)? L.selNone : L.selAll; save(); };
    box.appendChild(b);
  });
  $('catNote').textContent = (S.hintLevel==='clue') ? L.catNote : '';
}

$('btnAll').onclick = ()=>{
  const packs=usablePacks(), ids=packs.map(p=>p.id);
  const allOn = ids.every(id=>S.cats.includes(id));
  S.cats = allOn ? S.cats.filter(c=>!ids.includes(c)) : S.cats.concat(ids.filter(id=>!S.cats.includes(id)));
  renderChips(); save();
};
$('pMinus').onclick=()=>{S.players--;renderSetup();save()};
$('pPlus').onclick =()=>{S.players++;renderSetup();save()};
$('iMinus').onclick=()=>{S.imposters--;renderSetup();save()};
$('iPlus').onclick =()=>{S.imposters++;renderSetup();save()};
$('swNames').onclick=()=>{S.useNames=!S.useNames;renderSetup();save()};
document.querySelectorAll('#segHint button').forEach(b=> b.onclick=()=>{
  S.hintLevel=b.dataset.h;
  if(S.hintLevel==='clue' && !usablePacks().some(p=>S.cats.includes(p.id)))
    S.cats = S.cats.concat(usablePacks().slice(0,4).map(p=>p.id));
  renderSetup(); save();
});
document.querySelectorAll('#segTime button').forEach(b=> b.onclick=()=>{S.timeSet=+b.dataset.t;renderSetup();save()});

/* ================= OSZTÁS ================= */
$('btnStart').onclick = ()=>{
  const pool = usablePacks().filter(p=>S.cats.includes(p.id));
  if(!pool.length){ $('setupErr').textContent=t().needCat; return; }
  $('setupErr').textContent=''; S.round=0; S.team=0; S.imp=0; newRound();
};

/* egy témán belül csak akkor ismétlődik szó, ha már mind sorra került */
const used = new Set();
function newRound(){
  const pool = usablePacks().filter(p=>S.cats.includes(p.id));
  const pack = pool[Math.floor(Math.random()*pool.length)];
  const words = packWords(pack);
  const key = w => S.lang+'|'+pack.id+'|'+w;
  let fresh = words.filter(w=>!used.has(key(w)));
  if(!fresh.length){ words.forEach(w=>used.delete(key(w))); fresh = words; }
  S.word = fresh[Math.floor(Math.random()*fresh.length)];
  used.add(key(S.word));
  S.catName = packName(pack); S.packId = pack.id;
  const others = words.filter(x=>x!==S.word);
  S.decoy = others.length ? others[Math.floor(Math.random()*others.length)] : S.word;
  S.clue = (CLUEMAP[pack.id] && CLUEMAP[pack.id][S.word]) || '';

  const idx=[...Array(S.players).keys()];
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  S.impIdx = idx.slice(0,S.imposters);
  S.starter = Math.floor(Math.random()*S.players);
  S.dealIdx = 0; S.round++; S.pointGiven=null;
  stopTimer(); renderDeal(); show('s-deal');
}

const card=$('card'); let seen=false, pending=null, clearTid=null;

function spyTip(){
  const L=t();
  if(S.hintLevel==='letters'){
    const words=S.word.trim().split(/\s+/).length;
    const letters=S.word.replace(/[\s'’-]/g,'').length;
    return L.letters(words, letters, S.word.trim().charAt(0).toUpperCase());
  }
  if(S.hintLevel==='clue') return S.clue ? L.clue(S.clue) : '';
  if(S.hintLevel==='decoy') return L.decoy(S.decoy.toUpperCase())+'\n'+L.decoyNote;
  return '';
}

/* A kártya zárt állapotban MINDENKINEK ugyanaz: se szín, se szöveg nem árul el
   semmit, a tartalom csak nyomva tartás közben kerül bele. */
function clearFront(){
  $('cardRole').textContent=''; $('cardWord').textContent='';
  $('cardCat').textContent='';  $('cardTip').textContent='';
  card.classList.remove('spy');
}

function renderDeal(){
  const L=t(); seen=false;
  clearTimeout(clearTid);
  card.classList.remove('open');
  clearFront();
  $('btnNext').disabled=true;
  $('dealCount').textContent=(S.dealIdx+1)+' / '+S.players;
  $('dealWho').textContent=L.passTo(nameOf(S.dealIdx));
  $('dealHint').textContent=L.holdHint;
  pending = S.impIdx.includes(S.dealIdx)
    ? { spy:true,  role:L.yourRole, word:L.youAreSpy,
        cat:(S.hintLevel==='none') ? '' : L.theme(S.catName), tip:spyTip() }
    : { spy:false, role:L.yourWord, word:S.word, cat:S.catName, tip:'' };
}

function openCard(){
  if(!pending) return;
  clearTimeout(clearTid);
  $('cardRole').textContent=pending.role;
  $('cardWord').textContent=pending.word;
  $('cardCat').textContent=pending.cat;
  $('cardTip').textContent=pending.tip;
  card.classList.toggle('spy', pending.spy);
  card.classList.add('open');
  if(!seen){ seen=true; $('btnNext').disabled=false; $('dealHint').textContent=t().letGo; }
}
function closeCard(){
  if(!card.classList.contains('open')) return;
  card.classList.remove('open');
  clearTimeout(clearTid);
  clearTid = setTimeout(()=>{ if(!card.classList.contains('open')) clearFront(); }, 170);
}
card.addEventListener('pointerdown',e=>{e.preventDefault();card.setPointerCapture(e.pointerId);openCard()});
card.addEventListener('pointerup',closeCard);
card.addEventListener('pointercancel',closeCard);
card.addEventListener('pointerleave',closeCard);
card.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();openCard()}});
card.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){closeCard()}});
card.addEventListener('contextmenu',e=>e.preventDefault());
$('btnNext').onclick=()=>{ S.dealIdx++; if(S.dealIdx>=S.players) startRound(); else renderDeal(); };

/* ================= KÖR ================= */
let tId=null, tLeft=0, tRunning=false;
const fmt = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

function startRound(){
  const L=t();
  $('roundNo').textContent=L.round(S.round);
  $('starterName').textContent=nameOf(S.starter);
  $('roundTheme').textContent = (S.hintLevel==='none') ? L.roundThemeNo : L.roundTheme(S.catName);
  updScore();
  tLeft=S.timeSet; tRunning=false;
  $('timer').textContent = S.timeSet? fmt(tLeft) : '—';
  $('timer').classList.remove('low');
  $('btnTimer').style.display = S.timeSet? 'block':'none';
  $('btnTimer').textContent = L.start;
  show('s-round');
}
function stopTimer(){ if(tId){clearInterval(tId);tId=null;} tRunning=false; }
$('btnTimer').onclick=()=>{
  const L=t();
  if(tRunning){ stopTimer(); $('btnTimer').textContent=L.resume; return; }
  if(tLeft<=0) tLeft=S.timeSet;
  tRunning=true; $('btnTimer').textContent=L.pause;
  tId=setInterval(()=>{
    tLeft--; $('timer').textContent=fmt(Math.max(0,tLeft));
    $('timer').classList.toggle('low', tLeft<=15);
    if(tLeft<=0){ stopTimer(); $('btnTimer').textContent=L.again; beep(); }
  },1000);
};
function beep(){
  try{ const a=new (window.AudioContext||window.webkitAudioContext)();
    const o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value=660; o.type='square';
    g.gain.setValueAtTime(.12,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.5);
    o.start(); o.stop(a.currentTime+.5);
  }catch(e){}
}
function updScore(){
  $('scoreTeam').textContent=S.team; $('scoreImp').textContent=S.imp;
  $('scoreTeam2').textContent=S.team; $('scoreImp2').textContent=S.imp;
}

/* ================= SZAVAZÁS ================= */
$('btnVote').onclick=()=>{
  stopTimer();
  const l=$('voteList'); l.innerHTML='';
  for(let i=0;i<S.players;i++){
    const b=document.createElement('button'); b.textContent=nameOf(i); b.onclick=()=>result(i); l.appendChild(b);
  }
  show('s-vote');
};
$('btnSkipVote').onclick=()=>result(null);

function result(ejected){
  const L=t(), v=$('verdict');
  const caught = ejected!==null && S.impIdx.includes(ejected);
  if(ejected===null){
    v.className='verdict good'; v.querySelector('.h').textContent=L.noVote;
    v.querySelector('.b').textContent=L.noVoteB; S.pointGiven=null;
  }else if(caught){
    v.className='verdict good'; v.querySelector('.h').textContent=L.caught;
    v.querySelector('.b').textContent=L.caughtB(nameOf(ejected)); S.team++; S.pointGiven='team';
  }else{
    v.className='verdict bad'; v.querySelector('.h').textContent=L.wrong;
    v.querySelector('.b').textContent=L.wrongB(nameOf(ejected)); S.imp++; S.pointGiven='imp';
  }
  $('revWord').textContent=S.word;
  const imps=$('revImps'), who=document.createElement('b'), th=document.createElement('span');
  who.textContent=S.impIdx.map(nameOf).join(', ');
  th.style.cssText='color:#8695BE;font-size:13px'; th.textContent=L.theme(S.catName);
  imps.replaceChildren(L.spyWas(S.imposters>1)+' ', who, document.createElement('br'), th);
  $('fbWord').href = issueUrl(L.fbWordTitle(S.word, S.catName),
    L.fbWordBody(S.catName, S.packId, S.word, S.hintLevel==='clue' ? S.clue : ''));
  $('btnFlip').style.display=(S.pointGiven==='team')?'block':'none';
  $('btnFlip').textContent=L.flip; $('btnFlip').disabled=false;
  updScore(); show('s-result');
}
$('btnFlip').onclick=()=>{
  if(S.pointGiven==='team'){ S.team--; S.imp++; S.pointGiven='imp';
    $('btnFlip').textContent=t().flipped; $('btnFlip').disabled=true; updScore(); }
};
$('btnAgain').onclick=()=>newRound();
$('btnHome').onclick=()=>{ stopTimer(); renderSetup(); show('s-setup'); };

/* ================= INDÍTÁS ================= */
load().then(()=>{ applyLang(); renderSetup(); });

/* offline mód */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
